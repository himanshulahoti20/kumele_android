name: kuemele
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  video_player: ^2.9.3
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  dropdown_button2: ^3.1.0
  fl_chart: ^1.2.0
  dotted_border: ^3.1.0
  get:
  flutter_rating_bar: ^4.0.1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.0.1
  geolocator: ^14.0.3
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  http: ^1.4.0
  passkeys: ^2.21.0
  get_it: ^9.2.1
  gap: ^3.0.1
  flutter_smart_dialog: ^5.1.0
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  collection: ^1.19.1
  adaptive_theme: ^3.7.0
  equatable: ^2.0.7
  flutter_sticky_header: ^0.8.0
  flutter_card_swiper: ^7.0.2
  wheel_picker: ^0.3.0
  dio: ^5.9.0
  path_provider: ^2.1.5
  package_info_plus: ^10.2.0
  flutter_animate: ^4.5.2
  firebase_messaging: ^16.0.3
  app_settings: ^7.0.0
  firebase_core: ^4.2.0
  firebase_auth: ^6.5.4
  flutter_screenutil: ^5.9.3
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  go_router: ^15.1.2
  flutter_spinkit: ^5.2.2
  qr_flutter: ^4.1.0
  recaptcha_enterprise_flutter: ^18.9.1
  share_plus: ^13.2.0
  pinput: ^5.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_html: ^3.0.0
  mobile_scanner: ^7.2.1
  socket_io_client: ^3.1.6
  flutter_stripe: ^13.1.0
  flutter_paypal_payment: ^1.0.8
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_web_auth_2: ^5.1.0
  chucker_flutter: ^1.9.2
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  flutter_gen_runner: ^5.8.0
  geolocator_platform_interface: ^4.2.8

  flutter_lints: ^6.0.0
  test: ^1.31.0

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  image_path: "assets/appicon/kumele.png"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/appBar/
    - assets/icons/
    - assets/icons/notifications/
    - assets/icons/events/
    - assets/icons/blogs/
    - assets/icons/chats/
    - assets/logo/
    - assets/social/
    - assets/videos/
    - assets/images/
    - assets/animations/
    - assets/gifs/
    - assets/
    - assets/svg/
    - assets/appicon/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Italic.ttf
          style: italic
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
dependency_overrides:
  share_plus: ^13.2.0
